[package]
name = "thinkbook-fan-control"
version = "2.0.0"
edition = "2021"
description = "Native ultra-lightweight Lenovo ThinkBook 14 G6+ IMH Fan Controller & CPU/GPU Telemetry Daemon"

[[bin]]
name = "ThinkBookFanControl"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Wmi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
